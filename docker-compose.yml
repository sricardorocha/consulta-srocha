# Consulta Srocha - projeto Docker da VPS (Hostinger KVM 2)
# Endereco da API: https://consulta.srv1833889.hstgr.cloud
# Unica coisa a preencher: USUARIOS (login:senha separados por ;) no servico "api".

services:
  base:
    image: python:3.12-slim
    restart: unless-stopped
    mem_limit: 768m
    environment:
      DATA_DIR: /data
    volumes:
      - dados:/data
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq git >/dev/null &&
      python -c \"import urllib.request,tarfile,io;tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen('https://codeload.github.com/sricardorocha/consulta-srocha/tar.gz/main').read())).extractall('/opt')\" &&
      exec python -u /opt/consulta-srocha-main/sync.py"

  calculadora:
    image: eclipse-temurin:25-jdk
    restart: unless-stopped
    mem_limit: 1536m
    volumes:
      - calc:/opt/calc
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq git >/dev/null &&
      (test -d /opt/calc/rtc/.git || git clone -q --depth 1 https://github.com/ReceitaFederal/calculadora-rtc-regime-regular.git /opt/calc/rtc) &&
      cd /opt/calc/rtc && git fetch -q --depth 1 origin && git reset -q --hard FETCH_HEAD &&
      mkdir -p calculadora/db && rm -f calculadora/db/calculadora-pro.db &&
      ./mvnw -q -B flyway:migrate -Dflyway.configFiles=./flyway/flyway-pro.conf &&
      ./mvnw -q -B -DskipTests clean package &&
      exec java -Xmx768m -Dspring.profiles.active=offline -jar target/api-regime-geral.jar"

  api:
    image: python:3.12-slim
    restart: unless-stopped
    mem_limit: 384m
    depends_on: [base]
    environment:
      DATA_DIR: /data
      CALCULADORA_URL: http://calculadora:8080/api
      USUARIOS: "sergio:TROCAR_SENHA_SERGIO;debora:TROCAR_SENHA_DEBORA"
    volumes:
      - dados:/data
    command: >
      sh -c "pip install -q fastapi uvicorn httpx &&
      python -c \"import urllib.request,tarfile,io;tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen('https://codeload.github.com/sricardorocha/consulta-srocha/tar.gz/main').read())).extractall('/opt')\" &&
      exec python -u /opt/consulta-srocha-main/app.py"
    labels:
      - traefik.enable=true
      - traefik.http.routers.consulta.rule=Host(`consulta.srv1833889.hstgr.cloud`)
      - traefik.http.routers.consulta.entrypoints=websecure
      - traefik.http.routers.consulta.tls.certresolver=letsencrypt
      - traefik.http.services.consulta.loadbalancer.server.port=8000

volumes:
  dados:
  calc:
